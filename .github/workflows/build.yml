name: Build Flickr Downloader

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name FlickrDownloader main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickrDownloader-Windows
          path: dist/FlickrDownloader.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name FlickrDownloader main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickrDownloader-macOS
          path: dist/FlickrDownloader

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name FlickrDownloader main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickrDownloader-Linux
          path: dist/FlickrDownloader
