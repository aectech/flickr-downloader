# -*- coding: utf-8 -*-
name: Build Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.10'
            artifact-name: 'FlickrDownloader-windows'
          - os: ubuntu-latest
            python-version: '3.10'
            artifact-name: 'FlickrDownloader-linux'
          - os: macos-latest
            python-version: '3.10'
            artifact-name: 'FlickrDownloader-macos'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # 使用跨平台分隔符
          $sep = ';'
          pyinstaller --name=FlickrDownloader `
            --add-data="lang$sep lang" `
            --add-data="resources$sep resources" `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=PySide6.QtNetwork `
            --hidden-import=httpx `
            --hidden-import=PIL `
            --hidden-import=logging `
            --hidden-import=json `
            --onefile `
            --noconsole `
            --clean `
            main.py

      - name: Build application (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          # 使用跨平台分隔符
          SEP=':'
          pyinstaller --name=FlickrDownloader \
            --add-data="lang${SEP}lang" \
            --add-data="resources${SEP}resources" \
            --hidden-import=PySide6 \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=PySide6.QtNetwork \
            --hidden-import=httpx \
            --hidden-import=PIL \
            --hidden-import=logging \
            --hidden-import=json \
            --onefile \
            --noconsole \
            --clean \
            main.py

      - name: Rename executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if ($exe) {
            Rename-Item -Path $exe.FullName -NewName 'FlickrDownloader.exe'
          }

      - name: Rename executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f dist/FlickrDownloader ]; then
            mv dist/FlickrDownloader dist/FlickrDownloader.bin
            echo '#!/bin/bash' | cat - dist/FlickrDownloader.bin > dist/FlickrDownloader
            chmod +x dist/FlickrDownloader
          fi

      - name: Rename executable (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -f dist/FlickrDownloader ]; then
            mv dist/FlickrDownloader dist/FlickrDownloader.bin
            echo '#!/bin/bash' | cat - dist/FlickrDownloader.bin > dist/FlickrDownloader
            chmod +x dist/FlickrDownloader
          fi

      - name: Create release package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a ../FlickrDownloader-${{ matrix.artifact-name }}.zip FlickrDownloader.exe
          else
            tar -czvf ../FlickrDownloader-${{ matrix.artifact-name }}.tar.gz FlickrDownloader
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/FlickrDownloader*
            dist/lang/
            dist/resources/
          if-no-files-found: warn

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip artifacts/**/*.tar.gz artifacts/FlickrDownloader* 2>/dev/null || true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
